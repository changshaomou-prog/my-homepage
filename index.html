<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="常少谋的个人主页">
  <title>常少谋的个人主页</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      line-height: 1.8;
      text-align: center;
    }

    main {
      max-width: 680px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 8vw, 3.5rem);
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      font-size: clamp(1rem, 4vw, 1.25rem);
      color: #333333;
    }
  </style>
</head>
<body>
  <main>
    <h1>常少谋</h1>
    <p>我是天津工业大学服装表演专业学生，我正在用 AI 做网站作品集。</p>
  </main>
</body>
</html>
